[package]
name = "complete-story-cli"
version = "0.1.0"
edition = "2021"
authors = ["Complete Story Mod Team"]
description = "Native build, transformation, and packaging orchestrator for Dragon Ball Sparking! ZERO Complete Story mod."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
anyhow = "1.0.104"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
